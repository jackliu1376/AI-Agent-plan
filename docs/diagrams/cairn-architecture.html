<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cairn Agent 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf9f8;
      --color-ink:     #1b1a18;
      --color-muted:   #6d6a63;
      --color-soft:    #74716a;
      --color-accent:  #a4464f;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Cairn</p>
    <h1>Cairn Agent 架构</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cairn-architecture-title cairn-architecture-desc">
        <title id="cairn-architecture-title">Cairn Agent 架构</title>
        <desc id="cairn-architecture-desc">三个入口共用同一个编排循环；编排层调用大模型决定下一步，调度工具执行层取证；工具读写本地数据与外部接口，结果沉淀到数据与观测层。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d6a63"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a4464f"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d7c5c"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf9f8"/>

        <path d="M370 148 L370 196" fill="none" stroke="#6d6a63" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M640 148 L640 196" fill="none" stroke="#6d6a63" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M910 148 L910 196" fill="none" stroke="#6d6a63" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M460 300 L460 352" fill="none" stroke="#a4464f" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M820 300 L820 352" fill="none" stroke="#6d6a63" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M820 412 L820 464" fill="none" stroke="#6d6a63" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M820 520 L820 568" fill="none" stroke="#6d6a63" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="406" y="320" width="44" height="12" rx="2" fill="#faf9f8"/>
        <text x="450" y="329" fill="#74716a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">PROMPT</text>

        <rect x="830" y="320" width="32" height="12" rx="2" fill="#faf9f8"/>
        <text x="836" y="329" fill="#74716a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">CALL</text>

        <rect x="830" y="432" width="46" height="12" rx="2" fill="#faf9f8"/>
        <text x="836" y="441" fill="#74716a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">INVOKE</text>

        <g>
          <rect x="250" y="88" width="240" height="60" rx="6" fill="#faf9f8"/>
          <rect x="250" y="88" width="240" height="60" rx="6" fill="rgba(109,106,99,0.10)" stroke="#74716a" stroke-width="1"/>
          <text x="370" y="116" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">CLI</text>
          <text x="370" y="134" fill="#6d6a63" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">终端 · 流式输出</text>
        </g>
        <g>
          <rect x="520" y="88" width="240" height="60" rx="6" fill="#faf9f8"/>
          <rect x="520" y="88" width="240" height="60" rx="6" fill="rgba(109,106,99,0.10)" stroke="#74716a" stroke-width="1"/>
          <text x="640" y="116" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Web</text>
          <text x="640" y="134" fill="#6d6a63" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FastAPI + SSE</text>
        </g>
        <g>
          <rect x="790" y="88" width="240" height="60" rx="6" fill="#faf9f8"/>
          <rect x="790" y="88" width="240" height="60" rx="6" fill="rgba(109,106,99,0.10)" stroke="#74716a" stroke-width="1"/>
          <text x="910" y="116" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Desktop</text>
          <text x="910" y="134" fill="#6d6a63" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">pywebview 窗口</text>
        </g>

        <g>
          <rect x="100" y="196" width="1080" height="104" rx="6" fill="#faf9f8"/>
          <rect x="100" y="196" width="1080" height="104" rx="6" fill="rgba(164,70,79,0.08)" stroke="#a4464f" stroke-width="1"/>
          <text x="640" y="234" fill="#1b1a18" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Orchestrator.run_stream()</text>
          <text x="640" y="256" fill="#6d6a63" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">三端共用 · 唯一实现完整逻辑的入口</text>
          <text x="640" y="276" fill="#74716a" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MAX_TURNS 8 · TOOL_BUDGET 12 · IDEMPOTENT CACHE · 1 REPAIR</text>
        </g>

        <g>
          <rect x="300" y="352" width="320" height="60" rx="6" fill="#faf9f8"/>
          <rect x="300" y="352" width="320" height="60" rx="6" fill="rgba(27,26,24,0.03)" stroke="rgba(27,26,24,0.30)" stroke-width="1"/>
          <text x="460" y="380" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">LLMClient.chat()</text>
          <text x="460" y="398" fill="#6d6a63" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">OpenAI 兼容 · 返回 tool_calls</text>
        </g>
        <g>
          <rect x="660" y="352" width="320" height="60" rx="6" fill="#faf9f8"/>
          <rect x="660" y="352" width="320" height="60" rx="6" fill="#ffffff" stroke="#1b1a18" stroke-width="1"/>
          <text x="820" y="380" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">ToolRunner</text>
          <text x="820" y="398" fill="#6d6a63" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">双通道：进程内 · MCP stdio</text>
        </g>

        <g>
          <rect x="660" y="464" width="320" height="56" rx="6" fill="#faf9f8"/>
          <rect x="660" y="464" width="320" height="56" rx="6" fill="#ffffff" stroke="#1b1a18" stroke-width="1"/>
          <text x="820" y="490" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">10 个工具</text>
          <text x="820" y="506" fill="#6d6a63" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">统一信封 {ok, data, error, meta}</text>
        </g>

        <g>
          <rect x="300" y="568" width="880" height="56" rx="6" fill="#faf9f8"/>
          <rect x="300" y="568" width="880" height="56" rx="6" fill="rgba(27,26,24,0.05)" stroke="#6d6a63" stroke-width="1"/>
          <text x="740" y="594" fill="#1b1a18" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">数据与观测</text>
          <text x="740" y="612" fill="#6d6a63" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">景点库 305 城 · 会话与版本链 · 运行记录</text>
        </g>

        <line x1="100" y1="652" x2="1180" y2="652" stroke="rgba(27,26,24,0.10)" stroke-width="0.8"/>

        <rect x="100" y="666" width="14" height="10" rx="2" fill="rgba(109,106,99,0.10)" stroke="#74716a" stroke-width="0.8"/>
        <text x="122" y="675" fill="#6d6a63" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">入口</text>

        <rect x="220" y="666" width="14" height="10" rx="2" fill="rgba(164,70,79,0.08)" stroke="#a4464f" stroke-width="0.8"/>
        <text x="242" y="675" fill="#6d6a63" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">编排核心</text>

        <rect x="360" y="666" width="14" height="10" rx="2" fill="rgba(27,26,24,0.03)" stroke="rgba(27,26,24,0.30)" stroke-width="0.8"/>
        <text x="382" y="675" fill="#6d6a63" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">外部模型</text>

        <rect x="500" y="666" width="14" height="10" rx="2" fill="#ffffff" stroke="#1b1a18" stroke-width="0.8"/>
        <text x="522" y="675" fill="#6d6a63" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">执行层</text>

        <rect x="620" y="666" width="14" height="10" rx="2" fill="rgba(27,26,24,0.05)" stroke="#6d6a63" stroke-width="0.8"/>
        <text x="642" y="675" fill="#6d6a63" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">数据存储</text>
      </svg>
    </div>
  </div>
</body>
</html>
