<!doctype html><meta charset="utf-8">
<body style="margin:0;padding:24px;background:#faf9f8;font:13px/1.35 -apple-system,'PingFang SC',sans-serif;color:#1b1a18">
<div style="display:flex;gap:40px;align-items:flex-start">

  <div>
    <div style="margin-bottom:10px;font-weight:500">设计稿的写法</div>
    <div style="width:190px">
      <div style="padding:6px 8px 6px 7px;border-radius:8px;background:#f6f5f3;border-left:2px solid #1b1a18">
        <div style="display:flex;align-items:flex-start;gap:7px">
          <span style="width:6px;height:6px;border-radius:50%;background:#1b1a18;flex:none;margin-top:5px"></span>
          <span style="font-weight:500">我想去乌鲁木齐</span>
        </div>
        <div style="font-size:11px;color:#a6a29a;margin:2px 0 0 13px">今天 · 14 步 · 完成</div>
      </div>
    </div>
    <div style="margin-top:8px;font-size:11px;color:#6d6a63">border-left:2px + border-radius:8px</div>
  </div>

  <div>
    <div style="margin-bottom:10px;font-weight:500">现在的写法</div>
    <div style="width:190px">
      <div style="position:relative;padding:6px 8px 6px 13px;border-radius:8px;background:#f6f5f3">
        <span style="position:absolute;left:0;top:0;bottom:0;width:8px;border:2px solid transparent;border-left-color:#1b1a18;border-top-color:#1b1a18;border-bottom-color:#1b1a18;border-radius:8px 0 0 8px/8px 0 0 8px"></span>
        <div style="display:flex;align-items:flex-start;gap:7px">
          <span style="width:6px;height:6px;border-radius:50%;background:#1b1a18;flex:none;margin-top:5px"></span>
          <span style="font-weight:500">我想去乌鲁木齐</span>
        </div>
        <div style="font-size:11px;color:#a6a29a;margin:2px 0 0 13px">今天 10:04 · 完成</div>
      </div>
    </div>
    <div style="margin-top:8px;font-size:11px;color:#6d6a63">伪元素 border:2px + 椭圆圆角</div>
  </div>

</div>
</body>
