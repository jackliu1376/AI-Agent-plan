# Cairn —— Nginx 站点配置
#
# 放到 /etc/nginx/sites-available/cairn，然后：
#   ln -s /etc/nginx/sites-available/cairn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 职责分工：
#   - 静态文件由 Nginx 直出（不走 Python，省下 uvicorn 的连接数）
#   - 只有 /api/ 转发给 uvicorn
#   - TLS 在这一层终止，后端只听 127.0.0.1:8000

upstream cairn_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    # 系统禁用了 IPv6 的话，把带 [::] 的两行都删掉 ——
    # 否则 nginx 启动会报 "Address family not supported by protocol"。
    listen [::]:80;
    server_name example.com;

    # Let's Encrypt 续期走这个路径，不要重定向掉
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ⚠️ Ubuntu 22.04 自带的是 nginx 1.18，它**不认识**独立的 `http2 on;`
    #    指令（那是 1.25.1 才加的），写了会直接 `unknown directive` 起不来。
    #    必须把 http2 写在 listen 行里。1.25+ 也兼容这种写法（只是提示 deprecated）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 静态资源 ----
    root /opt/cairn/task-planner/web/static;
    index index.html;

    # 首屏 gzip 后约 73KB（JS 66 + CSS 7）。3Mbps 带宽下不开 gzip 会慢 3 倍。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Vite 产物带内容哈希，可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存 —— 否则前端更新后用户一直加载旧 JS，
    # 这类问题在浏览器里排查起来极其费劲
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 高德 JS API 安全密钥代理 ----
    #
    # 这个文件**不在 git 里** —— 它含明文密钥，由 bootstrap.sh 从 .env
    # 生成到 /etc/nginx/snippets/amap-proxy.conf（权限 600）。
    #
    # 原理：前端只知道往 /_AMapService 转发，密钥在 Nginx 这一侧被拼进
    # 上游请求。浏览器拿不到密钥，即使 key 泄露也无法脱离你的域名使用。
    # 这是高德官方推荐的生产做法，对应 .env 里的 AMAP_SERVICE_HOST。
    #
    # 没有配置密钥时该文件只有一个注释行，include 依然成立。
    include /etc/nginx/snippets/amap-proxy.conf;

    # ---- API ----
    location /api/ {
        proxy_pass http://cairn_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端读这个头做限流（需配合 WEB_TRUST_PROXY=1）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ⚠️ SSE 必须关缓冲。默认 proxy_buffering on 会把事件攒着，
        #    前端看起来就是「一直没动静，最后一次性全出来」。
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # 一次生成 30 秒以上，默认 60 秒会在长任务上掐断连接
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # 可选：再叠一层 Basic Auth。应用层鉴权（.env 里的 WEB_ACCESS_TOKEN）
        # 已经够了，这一层只是额外挡扫描器，一般不用开 —— 开了浏览器会弹两次框。
        # auth_basic "Cairn";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # SPA 兜底。前端用的是 hash 路由，理论上用不到，
    # 但保留这一条可以避免手动输入深层路径时 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查不写访问日志，免得日志被刷屏
    location = /api/health {
        access_log off;
        proxy_pass http://cairn_app;
        proxy_set_header Host $host;
    }
}

