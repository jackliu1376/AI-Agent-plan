[project]
name = "task-planner"
version = "0.1.0"
description = "Cairn — 任务规划助手：把复杂任务自动分解为有序可执行的步骤（BYOA Experiment 1）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x：FastMCP 更名为 MCPServer，低层 Server 改用 on_list_tools/on_call_tool 回调
    "mcp>=2.2.0,<3",
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "zhconv>=1.4.3",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pywebview>=6.2.1",
    # 评测样本集用 YAML（需要注释说明每条样本的意图，JSON 做不到）
    "pyyaml>=6.0.1",
]

[project.scripts]
task-planner = "agent.cli:main"
task-planner-server = "mcp_server.server:main"
task-planner-web = "web.serve:main"
task-planner-desktop = "desktop.app:main"
task-planner-report = "agent.run_report:main"
task-planner-eval = "agent.eval_runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 必须与 [project.scripts] 的入口一致 —— 漏了 web / desktop 的话，
# 装完 wheel 跑 `task-planner-web` 会 ModuleNotFoundError。
# 本地 uv sync 时因为源码目录就在路径上，这个问题被掩盖了，
# 只有真正打包分发才暴露。
packages = ["agent", "mcp_server", "common", "web", "desktop"]
