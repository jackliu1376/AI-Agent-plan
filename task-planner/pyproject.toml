[project]
name = "task-planner"
version = "0.1.0"
description = "Cairn — 任务规划助手：把复杂任务自动分解为有序可执行的步骤（BYOA Experiment 1）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x：FastMCP 更名为 MCPServer，低层 Server 改用 on_list_tools/on_call_tool 回调
    "mcp>=2.2.0,<3",
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "zhconv>=1.4.3",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pywebview>=6.2.1",
    # 评测样本集用 YAML（需要注释说明每条样本的意图，JSON 做不到）
    "pyyaml>=6.0.1",
]

[project.scripts]
task-planner = "agent.cli:main"
task-planner-server = "mcp_server.server:main"
task-planner-web = "web.serve:main"
task-planner-desktop = "desktop.app:main"
task-planner-report = "agent.run_report:main"
task-planner-eval = "agent.eval_runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# ---------------------------------------------------------------------------
# Lint（ruff）
# ---------------------------------------------------------------------------
# 只做 check，不做 format —— 存量代码已经按人眼排过版，跑 formatter 会产生
# 上千行无关 diff，掩盖真实改动。需要统一格式时再单独开一次。

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "build", "dist", "*.egg-info", "web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # 行宽交给 formatter 判断；check 阶段报 E501 只会逼人写难读的短行
    "E501",
    # 中文全角标点在注释和用户文案里是正常的，不是「易混淆字符」
    "RUF001",
    "RUF002",
    "RUF003",
    # FastAPI 的 Depends() / Query() 作默认值是标准写法
    "B008",
]

# ---------------------------------------------------------------------------
# 类型检查（mypy）
# ---------------------------------------------------------------------------
# 从「能跑通」起步，不开 strict。存量代码的类型标注是渐进的，
# 一上来就 strict 会报几百条，没人会去修，最后只会把整个检查关掉。

[tool.mypy]
python_version = "3.11"
files = ["agent", "common", "mcp_server", "web"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# 不检查未标注类型的函数体 —— 那是 strict 的范畴，留到下一步
check_untyped_defs = false

# ---------------------------------------------------------------------------
# 覆盖率
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["agent", "common", "mcp_server", "web"]
omit = ["*/tests/*", "web/static/*"]

[tool.coverage.report]
# 实测 83%，下限设 80% —— 留 3 个点余量，避免正常波动（新增一个没测的分支）
# 就把 CI 打红。低于这个数说明有整块逻辑没被测到，值得停下来看看。
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 必须与 [project.scripts] 的入口一致 —— 漏了 web / desktop 的话，
# 装完 wheel 跑 `task-planner-web` 会 ModuleNotFoundError。
# 本地 uv sync 时因为源码目录就在路径上，这个问题被掩盖了，
# 只有真正打包分发才暴露。
packages = ["agent", "mcp_server", "common", "web", "desktop"]
